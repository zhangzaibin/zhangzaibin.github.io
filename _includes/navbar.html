<header class="site-header">
    <div class="container-lg nav-wrap">
        <a class="site-brand" href="{{ '/' | relative_url }}"><span class="brand-dot" aria-hidden="true"></span>{{ site.data.profile.navbar_name }}</a>
        <button class="menu-toggle" type="button" aria-controls="main-navigation" aria-expanded="false">Menu</button>
        <nav class="main-navigation" id="main-navigation" aria-label="Main navigation">
            {% for item in site.data.navigation.pages %}
            <a href="{{ item.url | relative_url }}" {% if item.name == page.navbar_title %}aria-current="page"{% endif %}>{{ item.name }}</a>
            {% endfor %}
            <a class="nav-lab" href="{{ site.data.profile.lab_url }}" target="_blank" rel="noopener noreferrer">EML Lab <span aria-hidden="true">↗</span></a>
        </nav>
    </div>
</header>
