{% assign recent_news = site.news | sort: "date" | reverse | slice: 0, include.limit %}
<section class="news-section page-section" id="news" aria-labelledby="news-heading">
    <div class="section-heading"><h2 id="news-heading">News</h2></div>
    <div class="news-list">
        {% for item in recent_news %}
        <div class="news-item"><time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: "%b %Y" }}</time><div>{{ item.title }}</div></div>
        {% endfor %}
    </div>
</section>
