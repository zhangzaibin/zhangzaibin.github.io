<section class="about-section page-section" id="about" aria-labelledby="about-heading">
    <div class="section-intro">
        <h2 id="about-heading">About</h2>
    </div>
    <div class="text-profile-bio" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
        {{ site.data.profile.short_bio }}
        {% if site.data.profile.cv_link %}<a target="_blank" rel="noopener noreferrer" href="{{ site.data.profile.cv_link | relative_url }}">Curriculum Vitae ↗</a>{% endif %}
    </div>
</section>
