{% assign publications = include.publications %}
<section class="publications-section page-section" id="publications" aria-labelledby="publications-heading">
    <div class="section-heading">
        <h2 id="publications-heading">{{ include.title | default: 'Selected publications' }}</h2>
        <a class="text-link" href="{{ '/publications' | relative_url }}">All publications <span aria-hidden="true">↗</span></a>
    </div>
    <div class="publications-list">
        {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item %}
        {% endfor %}
    </div>
</section>
