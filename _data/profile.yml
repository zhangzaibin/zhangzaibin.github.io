short_bio_text_justify: false
short_bio: >-
  <p>
    Hi I am Zaibin Zhang (张再斌), a Ph.D. candidate at
    <a href="https://www.dlut.edu.cn/" target="_blank">Dalian University of Technology</a>
    and the founder of <a href="https://zhangzaibin.github.io/evolving-machines" target="_blank" rel="noopener noreferrer">Evolving Machines Lab</a>.
    I was previously a visiting scholar at the <a href="https://www.ox.ac.uk/" target="_blank">University of Oxford</a> and a research intern at the <a href="https://www.shlab.org.cn/" target="_blank">Shanghai Artificial Intelligence Laboratory</a>.
  </p>
  <p>
    My research asks how artificial intelligence can stay reliable, open, and continually self-evolving as it moves from a single agent to groups, societies, and the physical world.
    This question has shaped one coherent trajectory: multi-agent system → agent societies → embodied intelligence → scientific discovery.
  </p>
  <p>
    Along this path I proposed <a href="https://arxiv.org/abs/2401.11880" target="_blank">PsySafe</a>, the first systematic study of attack, evaluation, and defense for multi-agent systems (<strong>ACL 2024 Outstanding Paper Award</strong>);
    built <a href="https://github.com/camel-ai/oasis" target="_blank">OASIS</a>, an open framework simulating agent societies at <strong>million-agent scale</strong> (<strong>5,000+ stars</strong>, <strong>200+ citations</strong>) that has served as a technical foundation for <strong>dozens of papers at leading conferences and journals</strong> and <strong>multiple startups</strong>, including <strong>MiroFish</strong>;
    released <a href="https://github.com/zhangzaibin/spagent" target="_blank">SPAgent</a> to move agents into multimodal perception and physical interaction;
    and defined multi-arm compositional generalization with <a href="https://github.com/zhangzaibin/future-robots" target="_blank">MA-VLA</a>.
  </p>
  <p>
    My strength is not only completing individual studies, but repeatedly identifying frontier problems in agent development early and turning them into systematic frameworks, open-source infrastructure, and real-world impact—toward an agent ecosystem that is trustworthy, open, and able to keep evolving.
  </p>
  <p>
    My Ph.D. advisor is IEEE Fellow <a href="https://faculty.dlut.edu.cn/huchuan_Lu/en/index.htm" target="_blank">Prof. Huchuan Lu</a>, and I work closely with <a href="http://faculty.dlut.edu.cn/wanglj/zh_CN/index.htm" target="_blank">Prof. Lijun Wang</a> and <a href="https://faculty.dlut.edu.cn/wangyifan/en/index.htm" target="_blank">Yifan Wang</a>.
    I also collaborate closely with <a href="https://eng.ox.ac.uk/people/philip-torr" target="_blank">Prof. Philip Torr</a> and <a href="https://yinzhenfei.github.io/" target="_blank">Zhenfei Yin</a> at the University of Oxford.
    In the past, I was also very fortunate to collaborate with <a href="https://amandajshao.github.io/" target="_blank">Jing Shao</a> at Shanghai AI Lab.
    Of course, I have also collaborated with many talented friends—from rising early-career scholars to those at the height of their careers—too numerous to list individually here.
  </p>
  <p>
    I warmly welcome everyone to reach out for a chat or an exchange of ideas, and I am always open to collaboration!
  </p>

