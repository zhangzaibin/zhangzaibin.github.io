short_bio_text_justify: false
short_bio: >-
  <p>
    I am Zaibin Zhang, a Ph.D. candidate at
    <a href="https://www.dlut.edu.cn/" target="_blank">Dalian University of Technology</a>.
    My research focuses on agents in both the digital and physical worlds.
  </p>
  <p>
    Previously, I was a visiting Ph.D. student with the TVG Group at the
    <a href="https://www.ox.ac.uk/" target="_blank">University of Oxford</a>.
    I was also a research intern at Shanghai AI Laboratory.
  </p>
  <p>
    For agents in the digital world, I study how agents interact, collaborate, and evolve in complex environments.
    This line of work includes agent societies, agents for science, and self-evolving agents.
    I developed <a href="https://github.com/camel-ai/oasis" target="_blank">OASIS</a>, an open-source framework for large-scale agent-society simulation.
    I also study multi-agent system safety.
    <a href="https://arxiv.org/abs/2401.11880" target="_blank">PsySafe</a> was the first systematic study of safety in multi-agent systems and received the <strong>ACL 2024 Outstanding Paper Award</strong>.
  </p>
  <p>
    For agents in the physical world, I work on embodied agents that perceive, reason, and act in real environments.
    My current work covers multimodal agent systems, vision-language-action models, world-action models, and related infrastructure and hardware.
    <a href="https://github.com/zhangzaibin/spagent" target="_blank">SPAgent</a> is a multimodal agent framework for agents that perceive, reason, act, and interact in the physical world.
    <a href="https://arxiv.org/abs/2601.13029" target="_blank">Think3D</a> equips vision-language agents with interactive 3D reasoning for spatial tasks.
    <a href="https://github.com/zhangzaibin/future-robots" target="_blank">MA-VLA</a> studies multi-arm collaboration and compositional generalization with vision-language-action models.
  </p>
  <p>
    My open-source projects have collectively received more than <strong>5,000 GitHub stars</strong> and attracted broad interest from the research community.
    I am always happy to discuss research and potential collaborations.
    Feel free to contact me at
    <a href="mailto:dlutzzb@gmail.com">dlutzzb@gmail.com</a>.
  </p>

