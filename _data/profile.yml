short_bio: >-
  <p>
    I am a Ph.D. candidate at <a href="https://www.dlut.edu.cn/" target="_blank" rel="noopener noreferrer">Dalian University of Technology</a>
    and the founder of <a href="https://zhangzaibin.github.io/evolving-machines/" target="_blank" rel="noopener noreferrer">Evolving Machines Lab (EML)</a>.
    I was previously a visiting scholar at the <a href="https://www.ox.ac.uk/" target="_blank" rel="noopener noreferrer">University of Oxford</a> and a research intern at the <a href="https://www.shlab.org.cn/" target="_blank" rel="noopener noreferrer">Shanghai Artificial Intelligence Laboratory</a>.
  </p>
  <p>
    At EML, I work on agents that continue learning from interaction and feedback.
    My research covers <strong>compositional generalization</strong>, <strong>on-policy learning</strong>, and <strong>open-ended multimodal tool use</strong> in digital and physical environments.
  </p>
  <p>
    I am building three open-source ecosystems:
    <a href="https://github.com/camel-ai/oasis" target="_blank" rel="noopener noreferrer"><strong>OASIS</strong></a> for large-scale agent societies;
    <a href="https://github.com/zhangzaibin/spagent" target="_blank" rel="noopener noreferrer"><strong>SPAgent</strong></a> for multimodal tool use and spatial reasoning;
    and <a href="https://github.com/zhangzaibin/future-robots" target="_blank" rel="noopener noreferrer"><strong>Future Robots</strong></a> for embodied agents and compositional VLA policies.
  </p>
  <p>
    <a href="https://arxiv.org/abs/2401.11880" target="_blank" rel="noopener noreferrer">PsySafe</a> received an <strong>ACL 2024 Outstanding Paper Award</strong>.
    OASIS supports <strong>one million agents</strong> and has <strong>5,000+ GitHub stars</strong>.
    It has supported <strong>dozens of papers at leading AI conferences</strong> and served as a technical foundation for startup products such as <strong>MiroFish</strong>.
  </p>
  <p>
    My Ph.D. advisor is IEEE Fellow <a href="https://faculty.dlut.edu.cn/huchuan_Lu/en/index.htm" target="_blank" rel="noopener noreferrer">Prof. Huchuan Lu</a>, and I work closely with <a href="http://faculty.dlut.edu.cn/wanglj/zh_CN/index.htm" target="_blank" rel="noopener noreferrer">Prof. Lijun Wang</a> and <a href="https://faculty.dlut.edu.cn/wangyifan/en/index.htm" target="_blank" rel="noopener noreferrer">Yifan Wang</a>.
    I also collaborate with <a href="https://eng.ox.ac.uk/people/philip-torr" target="_blank" rel="noopener noreferrer">Prof. Philip Torr</a> and <a href="https://yinzhenfei.github.io/" target="_blank" rel="noopener noreferrer">Zhenfei Yin</a> at Oxford, and previously worked with <a href="https://amandajshao.github.io/" target="_blank" rel="noopener noreferrer">Jing Shao</a> at Shanghai AI Lab.
    Of course, I have also collaborated with many talented friends—from rising early-career scholars to those at the height of their careers—too numerous to list individually here.
  </p>

